name: Deploy to EC2
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/notes-api
            git pull origin main
            docker build -t notes-api-image .
            docker stop api-node22 || true
            docker rm api-node22 || true
            docker run -d -p 3000:3000 --name api-node22 notes-api-image
